<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مراجعة الاختبار القصير الأول | الصف 11 متقدم</title>

<!-- خط عربي مناسب -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<!-- MathJax لعرض الكسور/الجذور/الأسس بشكل كتابي -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)'], ['$', '$']], displayMath: [['\\[','\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
  :root{
    --bg:#f8fafc; --ink:#0f172a; --muted:#475569;
    --card:#ffffff; --line:#e2e8f0; --brand:#2563eb;
    --ok:#16a34a; --bad:#dc2626; --hint:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic", serif;line-height:1.75}
  .wrap{max-width:980px;margin:24px auto;padding:0 12px}
  header{margin-bottom:14px}
  h1{margin:.2rem 0 .6rem;font-size:clamp(20px,3vw,28px)}
  .sub{color:var(--muted);font-size:14px}
  .grid{display:grid;gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;
  }
  .qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .qnum{min-width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:#eef2ff;color:#1e293b;font-weight:700}
  .qtext{font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .choices{margin-top:10px;display:grid;gap:8px}
  .choice{
    display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafafa;cursor:pointer
  }
  .choice input{margin-top:5px;accent-color:var(--brand)}
  .choice.correct{border-color:#86efac;background:#f0fdf4}
  .choice.wrong{border-color:#fecaca;background:#fff1f2}
  .tools{display:flex;gap:8px;margin-top:8px}
  .btn-sm{
    background:#f8fafc;border:1px solid var(--line);color:#1e293b;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px
  }
  .panel{display:none;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#f9fafb}
  .panel.hint{border-right:4px solid var(--hint)}
  .panel.exp{border-right:4px solid var(--brand)}
  .controls{position:sticky;bottom:0;z-index:5;background:rgba(248,250,252,.9);backdrop-filter:saturate(1.2) blur(4px);
    border-top:1px solid var(--line);padding:10px 0;margin-top:14px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
  .btn{
    background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;min-width:160px
  }
  .btn.sec{background:#e2e8f0;color:#0f172a}
  .score{font-weight:700}
  .note{color:var(--muted);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>مراجعة الاختبار القصير الأول للصف الحادي عشر (متقدم)</h1>
    <div class="sub">الدروس: إكمال المربع • حل المعادلات الأكثر تعقيدًا • المتباينات التربيعية • تعريف الدالة والدالة المركبة • مجال ومدى الدوال</div>
  </header>

  <div id="questions" class="grid"></div>

  <div class="controls">
    <div class="actions">
      <div>
        <button class="btn" id="gradeBtn">تصحيح جميع الإجابات</button>
        <button class="btn sec" id="toggleSolBtn">إظهار/إخفاء الحلول</button>
      </div>
      <div class="score" id="scoreBox">لم يتم التصحيح بعد.</div>
    </div>
    <div class="note">اختر إجابة لكل سؤال ثم اضغط «تصحيح». يمكنك عرض «التلميح» أو «التفسير» لكل سؤال في أي وقت.</div>
  </div>
</div>

<script>
/* ————— بيانات الأسئلة (محسّنة الصياغة) ————— */
const QUESTIONS = [
  {q:"اكتب \\(س² − 10س + 35\\) في الصورة \\((س − أ)² + ب\\). حدِّد \\(أ\\) و\\(ب\\).",
   choices:["أ = 5 ، ب = 10","أ = 10 ، ب = 35","أ = −5 ، ب = 10","أ = 5 ، ب = −10"], ans:0,
   hint:"أكمل مربع \\(س² − 10س\\) بإضافة وطرح \\(25\\).",
   exp:"\\(س² − 10س = (س−5)² − 25\\) ⇒ \\(س² − 10س + 35 = (س−5)² + 10\\)."
  },
  {q:"لتكن \\(د(س)=س² − 3س − 4\\). اكتبها في الصورة \\((س − ل)² + ك\\).",
   choices:["ل = \\(\\dfrac{3}{2}\\) ، ك = \\(−\\dfrac{25}{4}\\)","ل = 3 ، ك = −4","ل = \\(\\dfrac{3}{2}\\) ، ك = \\(+\\dfrac{25}{4}\\)","ل = −\\(\\dfrac{3}{2}\\) ، ك = \\(−\\dfrac{25}{4}\\)"], ans:0,
   hint:"أكمل مربع \\(س²−3س\\) بإضافة وطرح \\(\\dfrac{9}{4}\\).",
   exp:"\\(د(س)=(س−\\dfrac{3}{2})²−\\dfrac{25}{4}\\)."
  },
  {q:"حل المتباينة \\(س² − 9س + 18 < 0\\).",
   choices:["س < 3 أو س > 6","3 < س < 6","س ≥ 6","س ≤ 3"], ans:1,
   hint:"حلِّل: \\((س−3)(س−6)\\).",
   exp:"الإشارة سالبة بين الجذرين ⇒ \\(3<س<6\\)."
  },
  {q:"حل المتباينة \\((س−2)(س+1) ≤ 0\\).",
   choices:["−1 ≤ س ≤ 2","س ≤ −1 أو س ≥ 2","−1 < س < 2","س ≥ −1 أو س ≤ 2"], ans:0,
   hint:"الضرب غير موجب بين الجذرين مع تضمينهما.",
   exp:"\\([-1,2]\\)."
  },
  {q:"لدالة تربيعية رأسها \\((0,−12)\\) ومجالها \\(−2 ≤ س ≤ 6\\)، وكانت \\(د(−2)=د(6)=4\\). ما المدى؟",
   choices:["−12 ≤ د(س) ≤ 4","4 ≤ د(س) ≤ 12","−4 ≤ د(س) ≤ 12","د(س) ≥ −12"], ans:0,
   hint:"الصغرى عند الرأس، والكبرى عند الطرفين.",
   exp:"المدى \\([−12,4]\\)."
  },
  {q:"للدالة \\(ص=(س−3)² − 8\\) حدِّد القيمة الصغرى والمدى.",
   choices:["الصغرى −8 والمدى \\(ص ≥ −8\\)","الصغرى 8 والمدى \\(ص ≤ 8\\)","الصغرى −8 والمدى \\(ص ≤ −8\\)","الصغرى 8 والمدى \\(ص ≥ 8\\)"], ans:0,
   hint:"قطع مكافئ لأعلى، الصغرى عند الرأس.",
   exp:"الرأس \\((3,−8)\\) ⇒ \\(ص≥−8\\)."
  },
  {q:"أي صورة مكافئة لعبارة \\(س² − 6س + 1\\)؟",
   choices:["\\(1 + (س−3)²\\)","\\(8 − (س−3)²\\)","\\((س−3)² − 8\\)","\\(9 − (س−3)²\\)"], ans:2,
   hint:"أضف واطرح \\(9\\).",
   exp:"\\(س²−6س+1=(س−3)²−8\\)."
  },
  {q:"إذا \\(س² − 6س + ك = (س−3)² + ب\\)، فكم \\(ك\\)؟",
   choices:["9","−9","10","−10"], ans:0,
   hint:"\\((س−3)²=س²−6س+9\\).",
   exp:"بالمقارنة \\(ك=9\\)."
  },
  {q:"أوجد \\(أ\\) بحيث \\(س² − 6س + 1 = (س − أ)² − 8\\).",
   choices:["−3","3","6","−6"], ans:1,
   hint:"طابق معامل \\(س\\).",
   exp:"\\(−2أ=−6\\Rightarrow أ=3\\)."
  },
  {q:"حل المعادلة \\(س − 2\\sqrt{س} = 10\\).",
   choices:["\\(12 + 2\\sqrt{11}\\)","25","9","15"], ans:0,
   hint:"ضع \\(\\sqrt{س}=ن\\).",
   exp:"\\(ن²−2ن−10=0\\Rightarrow ن=1+\\sqrt{11}\\) ⇒ \\(س=12+2\\sqrt{11}\\)."
  },
  {q:"ظلِّل حل المتباينة \\(س(س−3) ≥ 0\\).",
   choices:["س ≤ 0 ، س ≥ 3","−3 ≤ س ≤ 0","س > −3","0 ≤ س ≤ 3"], ans:0,
   hint:"موجب خارج الجذرين.",
   exp:"\\((−\\infty,0] \\cup [3,\\infty)\\)."
  },
  {q:"اكتب \\(ص = س² − 2س\\) في الصورة \\(ص=(س+أ)² + ل\\).",
   choices:["أ = −1 ، ل = −1","أ = +1 ، ل = −1","أ = −1 ، ل = +1","أ = +1 ، ل = +1"], ans:0,
   hint:"أكمل مربع \\(س²−2س\\).",
   exp:"\\(س²−2س=(س−1)²−1=(س+(−1))²+(−1)\\)."
  },
  {q:"إذا \\(ص=س²−6س+ك=(س−3)²\\) فما \\(ك\\)؟",
   choices:["−9","0","6","9"], ans:3,
   hint:"طوِّر \\((س−3)²\\).",
   exp:"\\(ك=9\\)."
  },
  {q:"اكتب \\(5س²+20س+55\\) في الصورة \\(أ(س+ب)²+ج\\).",
   choices:["أ=5 ، ب=2 ، ج=35","أ=5 ، ب=−2 ، ج=35","أ=1 ، ب=10 ، ج=55","أ=5 ، ب=2 ، ج= −35"], ans:0,
   hint:"اسحب 5 ثم أكمل المربع.",
   exp:"\\(5(س+2)²+35\\)."
  },
  {q:"\\(4س²+20س+5\\) في صورة مربع كامل هي \\((2س+5)²+ج\\). احسب \\(ج\\).",
   choices:["10","20","−20","−10"], ans:2,
   hint:"قارن مع \\((2س+5)²=4س²+20س+25\\).",
   exp:"نطرح 20 ⇒ \\(ج=−20\\)."
  },
  {q:"حوِّل \\(2س²−12س+3\\) إلى \\(2(س−3)²+ج\\). ما \\(ج\\)؟",
   choices:["15","36","−36","−15"], ans:3,
   hint:"أكمل داخل القوس ثم وزّع 2.",
   exp:"\\(2[(س−3)²−9]+3=2(س−3)²−15\\)."
  },
  {q:"حل \\(س − 4\\sqrt{س} − 12 = 0\\).",
   choices:["36","4","−4","−36"], ans:0,
   hint:"ضع \\(\\sqrt{س}=ن\\).",
   exp:"\\(ن=6\\Rightarrow س=36\\)."
  },
  {q:"أوجد جميع الحلول الحقيقية للمعادلة \\(س⁶ − 7س³ − 8 = 0\\).",
   choices:["س = 2 فقط","س = −1 فقط","س = 2 أو س = −1","لا حلول حقيقية"], ans:2,
   hint:"ضع \\(ت=س³\\).",
   exp:"\\((ت−8)(ت+1)=0\\Rightarrow س=2\\ أو \\ س=−1\\)."
  },
  {q:"حل \\(س⁴ + 2س² − 15 = 0\\).",
   choices:["\\(س = ±\\sqrt{3}\\)","\\(س = ±3\\)","\\(س = ±5\\)","لا حلول حقيقية"], ans:0,
   hint:"ضع \\(ع=س²\\).",
   exp:"\\((ع+5)(ع−3)=0\\Rightarrow س²=3\\ أو \\ س²=−5\\ ⇒ الحقيقي \\(±\\sqrt{3}\\)."
  },
  {q:"حل المتباينة \\(س³ − 10س + 24 ≥ 0\\).",
   choices:["س ≥ −4","س ≤ −4","س ≥ 4","−4 < س < 4"], ans:0,
   hint:"\\(س³−10س+24=(س+4)(س²−4س+6)\\).",
   exp:"التربيعي موجب دائمًا ⇒ التغيّر عند \\(−4\\) ⇒ الحل \\(س≥−4\\)."
  },
  {q:"لتكن \\(د(س)=2س+3\\) و \\(هـ(س)=\\dfrac{12}{1−س}\\) (حيث \\(س≠1\\)). أوجد \\((هـ∘د)(س)\\).",
   choices:["\\(\\dfrac{12}{1−(2س+3)}=\\dfrac{−6}{س+1}\\)","\\(\\dfrac{12}{1−2س}+3\\)","\\(\\dfrac{12}{1−س}+3\\)","\\(\\dfrac{12}{1−(2س−3)}\\)"], ans:0,
   hint:"عوِّض \\(2س+3\\) مكان \\(س\\) داخل \\(هـ\\).",
   exp:"\\((هـ∘د)(س)=\\dfrac{12}{1−(2س+3)}=\\dfrac{−6}{س+1}\\)."
  },
  {q:"إذا كان \\(هـ(س)=1−2س\\) و\\(د(س)=س³\\)، فأوجد \\((د∘هـ)(1)\\).",
   choices:["1","\\(\\dfrac{1}{2}\\)","−1","−\\(\\dfrac{1}{2}\\)"], ans:2,
   hint:"احسب \\(هـ(1)\\) ثم كبّر الأس.",
   exp:"\\(هـ(1)=−1\\Rightarrow (د∘هـ)(1)=(−1)³=−1\\)."
  },
  {q:"لتكن \\(هـ(س)=س²\\) و\\(د(س)=2س\\). احسب \\(د(هـ(2))\\).",
   choices:["2","4","8","16"], ans:2,
   hint:"\\(هـ(2)=4\\) ثم \\(د(4)=8\\).",
   exp:"القيمة النهائية 8."
  },
  {q:"لتكن \\(د(س)=س²−4\\). إذا كان المدى \\(−4 ≤ د(س) ≤ 5\\)، فما المجال \\([أ,ب]\\)؟",
   choices:["أ = −3 ، ب = 3","أ = −5 ، ب = 5","أ = −1 ، ب = 1","أ = 0 ، ب = 3"], ans:0,
   hint:"حل \\(س²−4=5\\) لطرفي المجال.",
   exp:"\\(س²=9 ⇒ س=±3\\) ⇒ المجال \\([−3,3]\\)."
  },
  {q:"لدالة أدنى قيمة \\(−10\\) وتمتد لأعلى بلا حد. ما مداها؟",
   choices:["\\(−10 ≤ د(س) ≤ 9\\)","\\(0 ≤ د(س) ≤ 9\\)","\\(2 ≤ د(س) ≤ 9\\)","\\(د(س) ≥ −10\\)"], ans:3,
   hint:"السهم صعودًا يعني لا حد أعلى.",
   exp:"المدى \\([−10,\\infty)\\)."
  },
  {q:"إذا كانت \\(د(س)=4س²−2\\) ومجالها \\(−2 ≤ س ≤ 3\\)، فأيٌّ مما يلي يعبّر عن المدى؟",
   choices:["\\(−2 ≤ د(س) ≤ 34\\)","\\(−2 ≤ د(س) ≤ 14\\)","\\(0 ≤ د(س) ≤ 34\\)","\\(−14 ≤ د(س) ≤ 34\\)"], ans:0,
   hint:"أقل قيمة عند \\(س=0\\).",
   exp:"\\([−2,34]\\)."
  },
  {q:"أي العلاقات التالية **واحد إلى متعدد** بالنسبة لـ\\(س→ص\\)؟",
   choices:["\\(ص=س+4\\)","\\(ص=س²+4\\)","\\(ص=س³+4\\)","\\(س=ص²+4\\)"], ans:3,
   hint:"ابحث عن علاقة تعطي لقيمة \\(س\\) الواحدة قيمتين لـ\\(ص\\).",
   exp:"\\(س=ص²+4\\Rightarrow ص=±\\sqrt{س−4}\\) ⇒ ليست دالة من \\(س\\) إلى \\(ص\\)."
  },
  {q:"إذا كان \\(د(س)=\\sqrt{س+3} − 2\\) و\\(هـ(س)=س²+6\\). أوجد \\((د∘هـ)(4)\\).",
   choices:["1","2","3","4"], ans:2,
   hint:"احسب \\(هـ(4)\\) ثم عوِّض في \\(د\\).",
   exp:"\\(هـ(4)=22\\Rightarrow د(22)=\\sqrt{25}−2=3\\)."
  },
  {q:"لتكن \\(هـ(س)=\\sqrt{س}\\) و\\(ل(س)=س+5\\). أي تعبير يمثل \\((هـ∘ل)(س)\\)؟",
   choices:["\\(\\sqrt{س}+5\\)","\\(\\sqrt{س+5}\\)","\\((\\sqrt{س})+5\\)","\\(س+\\sqrt{5}\\)"], ans:1,
   hint:"عوِّض \\(س+5\\) داخل الجذر.",
   exp:"\\((هـ∘ل)(س)=\\sqrt{س+5}\\)."
  },
  {q:"إذا كان \\(هـ(س)=س²\\) و\\(د(س)=2س\\)، فأوجد \\((هـ∘د)(2)\\).",
   choices:["2","4","8","16"], ans:3,
   hint:"\\(د(2)=4\\) ثم \\(هـ(4)=16\\).",
   exp:"القيمة 16."
  }
];

/* ————— توليد الصفحة ————— */
const container = document.getElementById('questions');

function makeChoiceLetter(i){ return ['أ','ب','ج','د'][i] || String(i+1); }

QUESTIONS.forEach((Q, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index = idx;

  card.innerHTML = `
    <div class="qhead">
      <div class="qnum">${idx+1}</div>
      <div class="qtext">${Q.q}</div>
    </div>
    <div class="meta">اختر الإجابة الصحيحة (اختيار من متعدد).</div>

    <div class="choices">
      ${Q.choices.map((c,i)=>`
        <label class="choice">
          <input type="radio" name="q${idx}" value="${i}">
          <div><strong>${makeChoiceLetter(i)})</strong> <span class="ct">${c}</span></div>
        </label>
      `).join('')}
    </div>

    <div class="tools">
      <button class="btn-sm hint-btn">💡 تلميح</button>
      <button class="btn-sm exp-btn">📘 تفسير</button>
    </div>

    <div class="panel hint">${Q.hint || "—"}</div>
    <div class="panel exp"><strong>الحل:</strong> ${Q.exp || "—"}</div>
  `;

  // تفعيل الأزرار
  const hintBtn = card.querySelector('.hint-btn');
  const expBtn  = card.querySelector('.exp-btn');
  const hintP   = card.querySelector('.panel.hint');
  const expP    = card.querySelector('.panel.exp');

  hintBtn.onclick = ()=> hintP.style.display = hintP.style.display==='block'?'none':'block';
  expBtn.onclick  = ()=> expP.style.display  = expP.style.display==='block' ?'none':'block';

  container.appendChild(card);
});

/* ————— التصحيح الجماعي ————— */
const gradeBtn = document.getElementById('gradeBtn');
const toggleSolBtn = document.getElementById('toggleSolBtn');
const scoreBox = document.getElementById('scoreBox');

gradeBtn.onclick = () => {
  let correct = 0;
  QUESTIONS.forEach((Q,idx)=>{
    const card = container.querySelector(`.card[data-index="${idx}"]`);
    const labels = [...card.querySelectorAll('.choice')];
    const radios  = [...card.querySelectorAll('input[type="radio"]')];
    const chosen = radios.find(r=>r.checked)?.value;
    labels.forEach((lab,i)=>{
      lab.classList.remove('correct','wrong');
      if(i == Q.ans) lab.classList.add('correct');
      if(chosen!=null && +chosen !== Q.ans && +chosen===i) lab.classList.add('wrong');
    });
    if(chosen!=null && +chosen===Q.ans) correct++;
  });
  scoreBox.textContent = `النتيجة: ${correct} / ${QUESTIONS.length} ( ${Math.round(correct/QUESTIONS.length*100)}% )`;
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise();
};

toggleSolBtn.onclick = () => {
  const all = document.querySelectorAll('.panel.exp');
  const show = [...all].some(p=>p.style.display!=='block');
  all.forEach(p=>p.style.display = show?'block':'none');
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise();
};

/* تفعيل MathJax أول مرة */
if (window.MathJax?.typesetPromise) MathJax.typesetPromise();
</script>
</body>
</html>
