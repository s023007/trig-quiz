<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار حساب المثلثات</title>

  <!-- تحميل MathJax لعرض الكسور والجذور -->
  <script id="MathJax-script" async 
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)']],
        macros: {
          جاس: '\\text{جاس}',
          جتاس: '\\text{جتاس}',
          ظاس: '\\text{ظاس}'
        }
      },
      chtml: { scale: 1.1 }
    };
  </script>

  <style>
    body {
      font-family: "Noto Sans Arabic", sans-serif;
      background-color: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: right;
      direction: rtl;
    }
    .question-box {
      max-width: 700px;
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
      margin: 40px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
  </style>
</head>

<body>
  <div class="question-box">
    <h1>اختبار الزوايا بين ٠° و ٩٠°</h1>
    <p>إذا كانت \\( \\جاس\\,س = \\dfrac{١}{٢} \\)، فأوجد قيمة \\( \\dfrac{١ - \\جتاس\\,س}{\\ظاس\\,س} \\).</p>
  </div>
</body>
</html>
