<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مراجعة الاختبار القصير الأول للصف الحادي عشر (متقدم)</title>

  <!-- خط عربي جميل -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- MathJax لعرض الرياضيات بشكل كتابي (كسور، جذور، أسس) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)'], ['$', '$']],
        displayMath: [['\\[','\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root{
      --bg:#0e1320;
      --card:#121a2b;
      --ink:#e8eefc;
      --muted:#b9c3dd;
      --brand:#4f7df2;
      --ok:#21c57b;
      --bad:#ff6b6b;
      --hint:#f7b500;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Noto Sans Arabic",system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: radial-gradient(1200px 800px at 90% -10%, #1b2440 0%, var(--bg) 60%) fixed;
      color:var(--ink);
      line-height:1.6;
    }

    .wrap{max-width:980px;margin:32px auto;padding:16px}
    header{
      display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px
    }
    .title{
      font-weight:800;font-size:clamp(18px,3vw,26px);
      letter-spacing:.2px
    }
    .topic-badges{display:flex;flex-wrap:wrap;gap:8px}
    .badge{
      background:linear-gradient(180deg,#1b2a4d,#15213a);
      color:var(--muted);
      border:1px solid #273859;
      border-radius:999px;
      padding:.25rem .6rem;
      font-size:13px
    }

    .progress{
      height:10px;border-radius:999px;background:#1a2440;border:1px solid #29365a;overflow:hidden;margin:10px 0 18px
    }
    .bar{height:100%;background:linear-gradient(90deg,#5a8bff,#7aa1ff);width:0%}

    .card{
      background:linear-gradient(180deg,#131c30,#0e1526);
      border:1px solid #253457;
      border-radius:20px;
      box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
      padding:18px 16px;
    }

    .q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .q-num{
      background:linear-gradient(180deg,#24385f,#1a2a4b);
      border:1px solid #2b3e67;color:#dbe6ff;
      width:38px;height:38px;display:grid;place-items:center;border-radius:12px;font-weight:700
    }
    .q-text{font-size:18px;font-weight:600}

    .icons{display:flex;gap:8px;margin-inline-start:auto}
    button.icon{
      display:inline-flex;align-items:center;gap:6px;
      background:#121a2b;border:1px solid #2a3a5f;color:#d7e2ff;
      padding:6px 10px;border-radius:10px;font-size:14px;cursor:pointer
    }
    button.icon:hover{border-color:#4160a8}
    .hint-panel,.exp-panel{
      display:none;margin-top:10px;border-radius:12px;padding:10px 12px;border:1px solid #2a3a5f;background:#0f1729;color:#d9e4ff
    }
    .hint-panel{border-right:4px solid var(--hint)}
    .exp-panel{border-right:4px solid #6aa5ff}

    .choices{display:grid;gap:10px;margin-top:12px}
    .choice{
      display:flex;gap:10px;align-items:flex-start;
      background:#0f1729;border:1px solid #233258;border-radius:14px;padding:10px 12px;cursor:pointer;
    }
    .choice input{margin-top:3px;accent-color:var(--brand)}
    .choice.correct{border-color:rgba(33,197,123,.6);box-shadow:0 0 0 2px rgba(33,197,123,.15) inset}
    .choice.wrong{border-color:rgba(255,107,107,.7);box-shadow:0 0 0 2px rgba(255,107,107,.12) inset}

    .status{
      margin-top:10px;font-weight:700
    }
    .status .ok{color:var(--ok)}
    .status .bad{color:var(--bad)}

    .actions{
      display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap
    }
    .btn{
      background:linear-gradient(180deg,#2a3d69,#223559);
      color:#e9f0ff;border:1px solid #35518c;
      padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700;min-width:120px;text-align:center
    }
    .btn.secondary{background:#121a2b;border-color:#2a3a5f;color:#cfe0ff}
    .btn:disabled{opacity:.45;cursor:not-allowed}

    .footer{
      margin-top:18px;color:var(--muted);font-size:13px;text-align:center
    }

    /* نتيجة النهاية */
    .result{
      text-align:center;padding:28px 16px
    }
    .score{
      font-size:44px;font-weight:800;margin:8px 0;color:#eaf1ff
    }
    .score small{font-size:16px;color:var(--muted);font-weight:600}
    .review{margin-top:18px;text-align:right}
    .review details{
      background:#0f1729;border:1px solid #233258;border-radius:14px;margin:10px 0;padding:10px 12px
    }
    .review summary{cursor:pointer;font-weight:700}
    .green{color:var(--ok)} .red{color:var(--bad)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">مراجعة الاختبار القصير الأول للصف الحادي عشر (متقدم)</div>
      <div class="topic-badges" id="topicBadges"></div>
    </header>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="card" id="card" aria-live="polite"></div>

    <div class="actions">
      <button class="btn secondary" id="prevBtn">السابق</button>
      <div style="display:flex;gap:10px">
        <button class="btn secondary" id="retryBtn" style="display:none">إعادة المحاولة</button>
        <button class="btn" id="nextBtn">التالي</button>
        <button class="btn" id="finishBtn">إنهاء الاختبار</button>
      </div>
    </div>

    <div class="footer">يدعم RTL و MathJax • يحتوي على تلميح 💡 وتفسير 📘 لكل سؤال</div>
  </div>

<script>
/* ========== بيانات الاختبار ========== */
const QUIZ = {
  quiz_title: "مراجعة الاختبار القصير الأول للصف الحادي عشر (متقدم)",
  rtl: true,
  topics: ["إكمال المربع","حل المعادلات الأكثر تعقيدًا","المتباينات التربيعية","تعريف الدالة والدالة المركبة","مجال ومدى الدوال"],
  shuffle_questions: true,
  show_explanations_after: "answer",
  questions: [
/* ==== 30 سؤال (نفس المحتوى المنسّق كما طلبت) ==== */
{id:"Q1",type:"mcq",skill:"إكمال المربع",
question:"اكتب \\(س² − 10س + 35\\) في الصورة \\((س − أ)² + ب\\). اختر القيم الصحيحة لـ\\(أ, ب\\).",
choices:["أ = 5 ، ب = 10","أ = 10 ، ب = 35","أ = −5 ، ب = 10","أ = 5 ، ب = −10"],
answer_index:0,
hint:"أكمل مربع \\(س² − 10س\\): أضف واطرح \\(25\\).",
explanation:"\\(س² − 10س = (س−5)² − 25\\) ⇒ \\(س² − 10س + 35 = (س−5)² + 10\\) فـ\\(أ=5, ب=10\\)."},
{id:"Q2",type:"mcq",skill:"إكمال المربع",
question:"لتكن \\(د(س)=س² − 3س − 4\\). اكتبها في الصورة \\((س − ل)² + ك\\) ثم اختر \\(ل, ك\\).",
choices:["ل = \\(\\dfrac{3}{2}\\) ، ك = \\(−\\dfrac{25}{4}\\)","ل = 3 ، ك = −4","ل = \\(\\dfrac{3}{2}\\) ، ك = \\(+\\dfrac{25}{4}\\)","ل = −\\(\\dfrac{3}{2}\\) ، ك = \\(−\\dfrac{25}{4}\\)"],
answer_index:0,
hint:"أكمل مربع \\(س²−3س\\) بإضافة وطرح \\(\\dfrac{9}{4}\\).",
explanation:"\\(س²−3س=(س−\\dfrac{3}{2})²−\\dfrac{9}{4}\\) لذا \\(د(س)=(س−\\dfrac{3}{2})²−\\dfrac{25}{4}\\)."},
{id:"Q3",type:"mcq",skill:"متباينة تربيعية",
question:"حل المتباينة \\(س² − 9س + 18 < 0\\).",
choices:["س < 3 أو س > 6","3 < س < 6","س ≥ 6","س ≤ 3"],
answer_index:1,
hint:"حلِّل: \\(س² − 9س + 18=(س−3)(س−6)\\).",
explanation:"الإشارة سالبة بين الجذرين: \\(3<س<6\\)."},
{id:"Q4",type:"mcq",skill:"متباينة من تحليل",
question:"حل المتباينة \\((س−2)(س+1) ≤ 0\\).",
choices:["−1 ≤ س ≤ 2","س ≤ −1 أو س ≥ 2","−1 < س < 2","س ≥ −1 أو س ≤ 2"],
answer_index:0,
hint:"حاصل الضرب غير موجب بين الجذرين مع تضمينهما.",
explanation:"الجذران \\(−1,2\\) ⇒ \\([-1,2]\\)."},
{id:"Q5",type:"mcq",skill:"مجال ومدى (مقيد)",
question:"لدالة تربيعية رأسها عند \\((0,−12)\\) ومجالها \\(−2 ≤ س ≤ 6\\)، وقيمة الدالة عند الطرفين \\(4\\). ما مداها؟",
choices:["−12 ≤ د(س) ≤ 4","4 ≤ د(س) ≤ 12","−4 ≤ د(س) ≤ 12","د(س) ≥ −12"],
answer_index:0,
hint:"الصغرى عند الرأس، والكبرى عند الأطراف.",

{id:"Q6",type:"mcq",skill:"مدى/مجال من رأس القطع",

choices:["الصغرى −8 والمدى \\(ص ≥ −8\\)","الصغرى 8 والمدى \\(ص ≤ 8\\)","الصغرى −8 والمدى \\(ص ≤ −8\\)","الصغرى 8 والمدى \\(ص ≥ 8\\)"],
answer_index:0,
hint:"شكل رأسية لأعلى: القيمة عند الرأس هي الصغرى.",
explanation:"الرأس \\((3,−8)\\) ⇒ المدى \\([−8,∞)\\)."},
{id:"Q7",type:"mcq",skill:"إكمال المربع",
question:"ظلِّل الصيغة المكافئة لـ \\(س² − 6س + 1\\):",
choices:["1 + (س−3)²","8 − (س−3)²","(س−3)² − 8","9 − (س−3)²"],
answer_index:2,
hint:"أكمل مربع \\(س²−6س\\) بإضافة وطرح \\(9\\).",
explanation:"\\(س²−6س+1=(س−3)²−9+1=(س−3)²−8\\)."},
{id:"Q8",type:"mcq",skill:"مطابقة معاملات",
question:"إذا \\(س² − 6س + ك = (س−3)² + ب\\) فاختر قيمة \\(ك\\) الصحيحة.",
choices:["ك = 9","ك = −9","ك = 10","ك = −10"],
answer_index:0,
hint:"\\((س−3)²=س²−6س+9\\).",

{id:"Q9",type:"mcq",skill:"إكمال المربع – معلمة",

{id:"Q10",type:"mcq",skill:"معادلة جذرية",
question:"حل المعادلة \\(س − 2√{س} = 10\\).",

{id:"Q11",type:"mcq",skill:"متباينات تربيعية",

answer_index:0,
hint:"الإشارة موجبة خارج الجذرين.",
explanation:"الجذران 0 و3 ⇒ \\((−∞,0] \\cup [3,∞)\\)."},
{id:"Q12",type:"mcq",skill:"إكمال المربع",

{id:"Q13",type:"mcq",skill:"مطابقة معاملات",
question:"إذا \\(ص=س²−6س+ك=(س−3)²\\) فاختر قيمة \\(ك\\).",
choices:["ك = −9","ك = 0","ك = 6","ك = 9"],
answer_index:3,
hint:"طوِّر \\((س−3)²\\).",
explanation:"\\((س−3)²=س²−6س+9\\) ⇒ \\(ك=9\\)."},
{id:"Q14",type:"mcq",skill:"إكمال المربع مع معامل",
question:"اكتب \\(5س²+20س+55\\) في الصورة \\(أ(س+ب)²+ج\\).",
choices:["أ=5 ، ب=2 ، ج=35","أ=5 ، ب=−2 ، ج=35","أ=1 ، ب=10 ، ج=55","أ=5 ، ب=2 ، ج= −35"],
answer_index:0,
hint:"اسحب 5 عاملًا ثم أكمل المربع.",

{id:"Q15",type:"mcq",skill:"إكمال المربع",
question:"العبارة \\(4س²+20س+5\\) في صورة مربع كامل هي \\((2س+5)²+ج\\). ظلِّل \\(ج\\).",

{id:"Q16",type:"mcq",skill:"إكمال المربع مع عامل",
question:"\\(2س²−12س+3\\) في صورة مربع كامل هي \\(2(س−3)²+ج\\). ما \\(ج\\)؟",
choices:["15","36","−36","−15"],
answer_index:3,
hint:"أكمل داخل القوس ثم وزّع 2.",
explanation:"\\(2[(س−3)²−9]+3=2(س−3)²−15\\) ⇒ \\(ج=−15\\)."},
{id:"Q17",type:"mcq",skill:"معادلة جذرية",
question:"حل \\(س − 4√{س} − 12 = 0\\).",
choices:["س = 36","س = 4","س = −4","س = −36"],
answer_index:0,
hint:"ضع \\(√{س}=ن\\) ⇒ \\(ن²−4ن−12=0\\).",
explanation:"\\(ن=6\\) أو \\(−2\\) ونأخذ الموجب ⇒ \\(س=36\\)."},
{id:"Q18",type:"mcq",skill:"تحويلات تكعيبية",
question:"أوجد جميع الحلول الحقيقية للمعادلة \\(س⁶ − 7س³ − 8 = 0\\).",

hint:"ضع \\(ت=س³\\) لتحصل على \\(ت² − 7ت − 8 = 0\\).",

{id:"Q19",type:"mcq",skill:"تحليل رباعي",
question:"حل \\(س⁴ + 2س² − 15 = 0\\) في \\(\\mathbb{R}\\).",
choices:["س = ±√{3}","س = ±3","س = ±5","لا حلول حقيقية"],
answer_index:0,
hint:"ضع \\(ع=س²\\) ثم حل \\(ع²+2ع−15=0\\).",

{id:"Q20",type:"mcq",skill:"متباينة تكعيبية",

answer_index:0,

{id:"Q21B",type:"mcq",skill:"تركيب دوال",

{id:"Q22",type:"mcq",skill:"تركيب دوال",
question:"إذا كان \\(هـ(س)=1−2س\\) و\\(د(س)=س³\\)، فأوجد \\((د∘هـ)(1)\\).",

{id:"Q23",type:"mcq",skill:"تركيب دوال من تعريفات",

choices:["√{س}+5","√{س+5}","(√{س})+5","س+√{5}"],
answer_index:1,
hint:"عوِّض \\(س+5\\) داخل الجذر.",
explanation:"\\((هـ∘ل)(س)=هـ(س+5)=√{س+5}\\)."},
{id:"Q30",type:"mcq",skill:"تحديد قيمة تركيب",
question:"إذا كان \\(هـ(س)=س²\\) و\\(د(س)=2س\\)، فأوجد \\((هـ∘د)(2)\\).",
choices:["2","4","8","16"],
answer_index:3,
hint:"\\(د(2)=4\\) ثم \\(هـ(4)=16\\).",
explanation:"الناتج \\(16\\)."}
]};

/* ========== منطق التطبيق ========== */
function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
const state = {
  idx:0,
  order: QUIZ.shuffle_questions ? shuffle([...QUIZ.questions.keys()]) : [...QUIZ.questions.keys()],
  answers: Array(QUIZ.questions.length).fill(null),
  correctness: Array(QUIZ.questions.length).fill(false)
};

const el = {
  card: document.getElementById('card'),
  bar: document.getElementById('bar'),
  prev: document.getElementById('prevBtn'),
  next: document.getElementById('nextBtn'),
  finish: document.getElementById('finishBtn'),
  retry: document.getElementById('retryBtn'),
  topicBadges: document.getElementById('topicBadges')
};

QUIZ.topics.forEach(t=>{
  const b=document.createElement('span'); b.className='badge'; b.textContent=t; el.topicBadges.appendChild(b);
});

function render(){
  const qi = state.order[state.idx];
  const q = QUIZ.questions[qi];

  el.bar.style.width = `${(state.idx)/ (QUIZ.questions.length) * 100}%`;

  el.card.innerHTML = `
    <div class="q-head">
      <div class="q-num">${state.idx+1}/${QUIZ.questions.length}</div>
      <div class="q-text">${q.question}</div>
      <div class="icons">
        <button class="icon" id="hintBtn">💡 تلميح</button>
        <button class="icon" id="expBtn">📘 تفسير</button>
      </div>
    </div>

    <div class="hint-panel" id="hintPanel">${q.hint || "لا يوجد تلميح."}</div>
    <div class="exp-panel" id="expPanel">${q.explanation || "—"}</div>

    <div class="choices" id="choices">
      ${q.choices.map((c,i)=>`
        <label class="choice ${ state.answers[qi]!=null ? (i===q.answer_index ? 'correct' : (i===state.answers[qi]?'wrong':'')) : ''}">
          <input type="radio" name="c" value="${i}" ${state.answers[qi]==i?'checked':''} ${state.answers[qi]!=null?'disabled':''}/>
          <div class="c-text">${c}</div>
        </label>
      `).join('')}
    </div>

    <div class="status" id="status"></div>
  `;

  // تفعيل MathJax
  if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();

  // الأزرار المساعدة
  document.getElementById('hintBtn').onclick = ()=> {
    const p = document.getElementById('hintPanel');
    p.style.display = p.style.display==='block' ? 'none' : 'block';
  };
  document.getElementById('expBtn').onclick = ()=> {
    const p = document.getElementById('expPanel');
    p.style.display = p.style.display==='block' ? 'none' : 'block';
  };

  // خيارات
  [...el.card.querySelectorAll('input[name="c"]')].forEach(inp=>{
    inp.addEventListener('change',()=>{
      const chosen = Number(inp.value);
      state.answers[qi]=chosen;
      const correct = (chosen===q.answer_index);
      state.correctness[qi]=correct;

      // تلوين
      const labels = [...el.card.querySelectorAll('.choice')];
      labels.forEach((lab,i)=>{
        if(i===q.answer_index) lab.classList.add('correct');
        if(i===chosen && i!==q.answer_index) lab.classList.add('wrong');
        lab.querySelector('input').disabled=true;
      });

      // رسالة
      const st = document.getElementById('status');
      st.innerHTML = correct ? `<span class="ok">✓ إجابة صحيحة</span>` :
        `<span class="bad">✗ إجابة غير صحيحة</span>`;

      // إظهار التفسير مباشرة بعد الإجابة إن رغبت
      if(QUIZ.show_explanations_after==="answer"){
        const exp = document.getElementById('expPanel'); exp.style.display='block';
      }
    });
  });

  // أزرار التنقّل
  el.prev.disabled = state.idx===0;
  el.next.disabled = state.idx>=QUIZ.questions.length-1;
}

function showResult(){
  const total = QUIZ.questions.length;
  const correct = state.correctness.filter(Boolean).length;
  const percent = Math.round(correct/total*100);

  el.bar.style.width = "100%";
  el.card.innerHTML = `
    <div class="result">
      <div style="font-size:22px;font-weight:700">انتهى الاختبار</div>
      <div class="score">${percent}% <small>(صحيح: ${correct} من ${total})</small></div>
      <div>
        <button class="btn" id="againBtn">إعادة المحاولة</button>
      </div>
      <div class="review">
        <h3>مراجعة الإجابات</h3>
        ${
          state.order.map((qi,i)=>{
            const q = QUIZ.questions[qi];
            const you = state.answers[qi];
            const ok = (you===q.answer_index);
            return `
              <details>
                <summary>${i+1}. ${ok?'<span class="green">✓</span>':'<span class="red">✗</span>'} ${q.question}</summary>
                <div style="margin-top:8px">
                  <div><strong>إجابتك:</strong> ${you!=null? q.choices[you] : '—'}</div>
                  <div><strong>الصحيحة:</strong> ${q.choices[q.answer_index]}</div>
                  <div style="margin-top:8px"><strong>التفسير:</strong> ${q.explanation || ''}</div>
                </div>
              </details>
            `;
          }).join('')
        }
      </div>
    </div>
  `;
  if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();

  const again = document.getElementById('againBtn');
  again.onclick = ()=> resetQuiz();
  el.prev.disabled = true;
  el.next.style.display = "none";
  el.finish.style.display = "none";
  el.retry.style.display = "inline-block";
  el.retry.onclick = ()=> resetQuiz();
}

function resetQuiz(){
  state.idx=0;
  state.order = QUIZ.shuffle_questions ? shuffle([...QUIZ.questions.keys()]) : [...QUIZ.questions.keys()];
  state.answers = Array(QUIZ.questions.length).fill(null);
  state.correctness = Array(QUIZ.questions.length).fill(false);
  el.next.style.display = "inline-block";
  el.finish.style.display = "inline-block";
  el.retry.style.display = "none";
  render();
}

// أزرار عامّة
el.prev.onclick = ()=>{ if(state.idx>0){ state.idx--; render(); } };
el.next.onclick = ()=>{ if(state.idx<QUIZ.questions.length-1){ state.idx++; render(); } };
el.finish.onclick = ()=> showResult();

// بداية
render();
</script>
</body>
</html>
